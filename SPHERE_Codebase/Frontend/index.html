<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/SPHERE-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPHERE — AI Requirements Engineering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="font-sans antialiased">
        <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="color: red; padding: 20px; font-family: monospace; background: #fee; z-index: 9999; position: relative;"><h2>Crash Detected</h2><pre>' + event.message + '\n\n' + event.filename + ':' + event.lineno + ':' + event.colno + '\n\n' + (event.error && event.error.stack ? event.error.stack : '') + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color: red; padding: 20px; font-family: monospace; background: #fee; z-index: 9999; position: relative;"><h2>Unhandled Promise Rejection</h2><pre>' + event.reason + '</pre></div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
